name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-core:
    name: core (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - os: macos-14
            target: aarch64-apple-darwin
            test: true
          - os: macos-14
            target: x86_64-apple-darwin
            test: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            test: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build core
        run: cargo build --release --manifest-path core/Cargo.toml --target ${{ matrix.target }}
      - name: Test core
        if: matrix.test
        run: cargo test --manifest-path core/Cargo.toml --target ${{ matrix.target }} --lib
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ai-client-core-${{ matrix.target }}
          path: |
            core/target/${{ matrix.target }}/release/ai-client
            core/target/${{ matrix.target }}/release/ai-client.exe

  build-web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --dir web
      - name: Typecheck
        run: pnpm --dir web exec tsc --noEmit -p tsconfig.app.json
      - name: Build
        run: pnpm --dir web run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ai-client-web
          path: web/dist

  build-desktop:
    name: desktop (${{ matrix.target }})
    needs: [build-core]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> desktop/src-tauri/target
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Build core (same target)
        run: cargo build --release --manifest-path core/Cargo.toml --target ${{ matrix.target }}
      - name: Stage core binary
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          TRIPLE="${{ matrix.target }}"
          if [ -f "core/target/$TRIPLE/release/ai-client.exe" ]; then
            cp "core/target/$TRIPLE/release/ai-client.exe" "desktop/src-tauri/binaries/ai-client-$TRIPLE.exe"
            cp "core/target/$TRIPLE/release/ai-client.exe" "desktop/src-tauri/binaries/ai-client.exe"
          else
            cp "core/target/$TRIPLE/release/ai-client" "desktop/src-tauri/binaries/ai-client-$TRIPLE"
            cp "core/target/$TRIPLE/release/ai-client" "desktop/src-tauri/binaries/ai-client"
          fi
          echo "Staged binaries:"
      - name: Fetch offline sidecars (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/fetch-sidecars.ps1 -All
          Get-ChildItem -Recurse -Depth 2 sidecars
      - name: Install web deps
        run: pnpm install --dir web
      - name: Build web
        run: pnpm --dir web run build
      - name: Install desktop deps
        run: pnpm --dir desktop install
      - name: Generate icons
        run: pnpm --dir desktop tauri icon src-tauri/icons/icon.png
      - name: Tauri build
        run: pnpm --dir desktop tauri build --target ${{ matrix.target }}
      - name: List bundle output
        shell: bash
        run: |
          echo "Listing release targets:"
          ls -la desktop/src-tauri/target/ || true
          ls -la "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/" || true
          ls -la "desktop/src-tauri/target/release/bundle/" || true
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-client-desktop-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
            desktop/src-tauri/target/release/bundle/


