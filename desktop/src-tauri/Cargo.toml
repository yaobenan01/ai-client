[package]
name = "ai-client-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri desktop shell for ai-client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
